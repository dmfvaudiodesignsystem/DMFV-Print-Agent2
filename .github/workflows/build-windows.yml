name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Verificar sintaxe
        run: npm run check

      - name: Gerar instalador
        run: npm run dist -- --publish never

      - name: Publicar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: DMFV-Print-Agent-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
          retention-days: 30
